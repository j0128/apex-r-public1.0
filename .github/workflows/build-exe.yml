name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main, claude/elegant-cray-jqaokz]
    paths:
      - "desktop/**"
      - "shared/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: pip install -r desktop/requirements.txt pyinstaller curl_cffi pytest

      - name: Run tests
        continue-on-error: true  # report only; do not block delivering the exe
        run: python -m pytest -q tests

      - name: Build exe
        working-directory: desktop
        run: pyinstaller --noconfirm --distpath dist --workpath build Apex-R.spec

      - name: Assemble package
        shell: pwsh
        working-directory: desktop
        run: |
          $out = "dist/Apex-R-4.0"
          Copy-Item config.yaml "$out/config.yaml"
          Copy-Item config_apex_m.yaml "$out/config_apex_m.yaml"
          # Apex-M uses the same exe with its own config
          Set-Content -Encoding UTF8 "$out/Apex-M.bat" "@echo off`r`nstart `"`" `"%~dp0Apex-R-4.0.exe`" --config `"%~dp0config_apex_m.yaml`"`r`n"
          Set-Content -Encoding UTF8 "$out/使用說明.txt" "雙擊 Apex-R-4.0.exe 即可使用（不需安裝 Python）。`r`nApex-M 請雙擊 Apex-M.bat。`r`n每月鎖定的持倉存放在同資料夾的 locked_books 內，請保留。`r`n設定檔 config.yaml 可用記事本編輯。"

      - name: Smoke test (exe must stay running 10 s)
        shell: pwsh
        working-directory: desktop/dist/Apex-R-4.0
        run: |
          $p = Start-Process -FilePath ".\Apex-R-4.0.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Apex-R-4.0.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-R-4.0-windows
          path: desktop/dist/Apex-R-4.0
          if-no-files-found: error
